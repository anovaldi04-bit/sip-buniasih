<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIP-BUNIASIH ONLINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background-color: #090d16; color: #ffffff; }

        /* Background Balai Desa Zoom In / Out */
        .bg-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; }
        .bg-balai-desa {
            width: 100%; height: 100%;
            background-image: url('balai-desa.jpg'); /* Pastikan file foto balai desa ada di folder */
            background-size: cover; background-position: center; background-repeat: no-repeat;
            animation: zoomInOutEstetik 24s ease-in-out infinite alternate;
            filter: brightness(0.65) contrast(1.1);
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.35) 0%, rgba(2, 6, 23, 0.88) 100%);
            backdrop-filter: blur(2px);
        }
        @keyframes zoomInOutEstetik {
            0% { transform: scale(1.0); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1.22); }
        }

        /* Kotak Login Glassmorphism */
        .login-container { position: relative; z-index: 10; height: 100vh; width: 100%; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card {
            position: relative; width: 100%; max-width: 440px; padding: 38px 32px;
            background: rgba(17, 25, 40, 0.62); backdrop-filter: blur(20px);
            border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .header-brand { text-align: center; margin-bottom: 24px; }
        .logo-emblem {
            width: 72px; height: 72px; margin: 0 auto 12px; background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.2); border-radius: 20px; display: flex; align-items: center; justify-content: center;
        }
        .logo-emblem img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
        .header-brand h1 { font-size: 22px; font-weight: 800; color: #f8fafc; margin-bottom: 4px; }
        .header-brand p { font-size: 12.5px; color: #94a3b8; }

        .input-group { position: relative; margin-bottom: 18px; }
        .input-label { display: block; font-size: 11.5px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; font-size: 15px; color: #64748b; }
        .custom-input {
            width: 100%; padding: 14px 46px; font-size: 14px; color: #ffffff;
            background: rgba(15, 23, 42, 0.65); border: 1.5px solid rgba(148, 163, 184, 0.22);
            border-radius: 14px; outline: none; transition: 0.3s;
        }
        .custom-input:focus { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18); }
        .toggle-password { position: absolute; right: 16px; background: none; border: none; color: #64748b; cursor: pointer; }

        .alert-box { display: none; padding: 10px 14px; border-radius: 10px; font-size: 12.5px; margin-bottom: 16px; background: rgba(239, 68, 68, 0.16); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
        
        .btn-portal {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff;
            font-size: 14.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5); transition: 0.3s;
        }
        .btn-portal:hover { transform: translateY(-2px); }
        .card-footer { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; font-size: 11px; color: #94a3b8; }
        .card-footer .creator-name { color: #34d399; font-weight: 700; display: block; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="bg-wrapper"><div class="bg-balai-desa"></div></div>
    <div class="bg-overlay"></div>

    <main class="login-container">
        <div class="login-card" id="loginCard">
            <div class="header-brand">
                <div class="logo-emblem">
                    <img src="logo-desa.png" alt="Logo Desa" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <i class="fa-solid fa-landmark" style="display:none; font-size: 26px; color: #34d399;"></i>
                </div>
                <h1>Portal Pemerintah Desa</h1>
                <p>Masukkan akun perangkat desa untuk masuk.</p>
            </div>

            <div class="alert-box" id="alertBox">Username atau Password salah!</div>

            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label class="input-label">USERNAME PENGGUNA</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="custom-input" placeholder="Masukkan username..." required>
                        <i class="fa-solid fa-user-tie input-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">KATA SANDI (PASSWORD)</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="custom-input" placeholder="Masukkan password..." required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <button type="button" class="toggle-password" id="togglePassword"><i class="fa-solid fa-eye" id="eyeIcon"></i></button>
                    </div>
                </div>

                <button type="submit" class="btn-portal" id="btnSubmit">
                    <span>Masuk ke Portal</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="card-footer">
                Project By <span class="creator-name">Ahmad Novaldi</span>
                UNIVERSITAS ISLAM AL-IHYA KUNINGAN &bull; 2023
            </div>
        </div>
    </main>

    <script>
        // 3 Akun Resmi Sesuai Permintaan
        const daftarPengguna = [
    { username: "muhamad ishak", password: "buniasih01", namaLengkap: "Muhamad Ishak", jabatan: "ADMIN - BIHI / KASI PEMERINTAHAN", role: "admin", dusun: "ALL" },
    { username: "samsudin ruslani", password: "buniaga01", namaLengkap: "Samsudin Ruslani", jabatan: "OPERATOR / PERANGKAT DESA", role: "kadus1", dusun: "Dusun 01 Buniaga" },
    { username: "samsun", password: "sulang02", namaLengkap: "Samsun", jabatan: "OPERATOR / PERANGKAT DESA", role: "kadus2", dusun: "Dusun 02" }
        ];

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const alertBox = document.getElementById('alertBox');
        const btnSubmit = document.getElementById('btnSubmit');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputUser = usernameInput.value.trim().toLowerCase();
            const inputPass = passwordInput.value.trim();

            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...';
            btnSubmit.disabled = true;

            setTimeout(() => {
                const userCocok = daftarPengguna.find(u => u.username.toLowerCase() === inputUser && u.password === inputPass);

                if (userCocok) {
                    // Simpan sesi ke browser
                    localStorage.setItem('userAktifDesa', JSON.stringify(userCocok));
                    
                    // LANGSUNG DIALIHKAN KE DASHBOARD.HTML
                    window.location.href = "dashboard.html";
                } else {
                    alertBox.style.display = 'block';
                    alertBox.textContent = "Username atau Password salah! Periksa kembali.";
                    btnSubmit.innerHTML = '<span>Masuk ke Portal</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>';
                    btnSubmit.disabled = false;
                }
            }, 600);
        });
    </script>
</body>
</html>
